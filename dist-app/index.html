<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lattice — a spreadsheet engine you can see working</title>
    <meta
      name="description"
      content="A spreadsheet formula engine with a Pratt parser, a dependency graph and incremental recalculation. Select any cell to see what it reads and what reads it."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" crossorigin src="/assets/index-DvVj2j7k.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DjtwwMqe.css">
  </head>
  <body>
    <div class="window">
      <header class="toolbar">
        <div class="brand">
          <span class="brand-mark">Lattice</span>
          <span class="brand-sub">spreadsheet engine</span>
        </div>

        <div class="tool-group">
          <button class="tool" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
          <button class="tool" id="redo" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
        </div>

        <div class="tool-group">
          <button class="tool tool-b" id="bold" title="Bold (Ctrl+B)" aria-pressed="false">B</button>
          <button class="tool tool-i" id="italic" title="Italic (Ctrl+I)" aria-pressed="false">I</button>
        </div>

        <div class="tool-group">
          <button class="tool" id="align-left" title="Align left" aria-label="Align left">⇤</button>
          <button class="tool" id="align-center" title="Align centre" aria-label="Align centre">↔</button>
          <button class="tool" id="align-right" title="Align right" aria-label="Align right">⇥</button>
        </div>

        <div class="tool-group">
          <button class="tool" id="fmt-auto" title="Automatic format">Auto</button>
          <button class="tool" id="fmt-currency" title="Currency">$</button>
          <button class="tool" id="fmt-percent" title="Percentage">%</button>
          <button class="tool" id="fmt-comma" title="Thousands separator">,</button>
        </div>

        <div class="tool-group">
          <button class="tool" id="import" title="Import a CSV file">Import</button>
          <button class="tool" id="export" title="Download as CSV">Export</button>
          <button class="tool" id="reset" title="Restore the sample workbook">Reset</button>
        </div>

        <div class="tool-group">
          <button class="tool" id="toggle-inspector" aria-pressed="true" title="Show or hide the dependency inspector">
            Inspector
          </button>
        </div>

        <div class="spacer"></div>
        <div class="stat" id="stat"></div>
      </header>

      <div class="formula-bar">
        <div class="addr" id="addr">A1</div>
        <div class="fx" aria-hidden="true">fx</div>
        <input
          class="formula-input"
          id="formula"
          spellcheck="false"
          autocomplete="off"
          aria-label="Formula"
          placeholder="Type a value, or = to start a formula"
        />
        <div class="ac" id="ac" hidden role="listbox" aria-label="Function suggestions"></div>
      </div>

      <div class="body" id="body">
        <!-- the grid is inserted here -->
        <aside class="inspector" id="inspector" aria-label="Dependency inspector"></aside>
      </div>

      <nav class="tabs" id="tabs" aria-label="Sheets"></nav>
    </div>

    <input type="file" id="file" accept=".csv,text/csv" hidden />
  </body>
</html>
